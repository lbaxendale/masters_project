<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">
    <title>nutrifem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
</head>

<body>
  <header class="navbar">
    <div class="menu-icon" onclick="openNav()">&#9776;</div>

    <div class="logo">
      <span class="flower-icon">&#10048;</span> nutrifem </div>
      
    <a href="/login" class="btn btn-login">Login</a>
  </header>

  <!--To trigger the menu-->
  <div id="sideMenu" class="sidebar">
    <!-- Adding close button inside the menu-->
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <!--Links on the menu-->
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/login" class="active">Login</a>
    <a href="/register">Register</a>
  </div>

  <hr class="nav-divider">

  <main class="login-wrapper">
    <div class="login-container">
      <h1>Login</h1>

      <form class="login-form" action="/dashboard">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="text" 
            id="email" 
            name="email"
            maxlength="254"
            title="Please enter a valid email address."
            pattern="[\w\.-]+@[\w\.-]+\.[A-Za-z]{2,}$" 
            required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type ="submit" class="btn btn-submit">Log in</button>

        <div class="login-links">
          <a href="#">Forgotten password?</a>
          <a href="#">New here? Register</a>
        </div>
      </form>
    </div>
  </main>
    
  <!--JavaScript for menu sidebar-->
  <script>
    /*Opening the menu by changing the width to 250px */
    function openNav() {
      document.getElementById("sideMenu").style.width = "250px";
    }

    /*Closing the menu by changing the width back to 0 */
    function closeNav() {
      document.getElementById("sideMenu").style.width = "0";
    }
  </script> 
</body>
</html>
