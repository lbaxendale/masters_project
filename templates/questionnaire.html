<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">
    <title>Questionnaire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/questionnaire.css') }}">
</head>

<body>
  <header class="navbar">
    <div class="menu-icon" onclick="openNav()">&#9776;</div>
    <div class="logo">
      <span class="flower-icon">&#10048;</span> nutrifem
    </div>

    <div class="user-profile">
        <span class="greeting">Hello, User</span>
        <span class="user-icon">&#128100;</span>
    </div>     
  </header>

  <!--To trigger the menu-->
  <div id="sideMenu" class="sidebar">
    <!-- Adding close button inside the menu-->
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <!--Links on the menu-->
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>

  <hr class="nav-divider">

  <main class="login-wrapper">
    <div class="login-container">
      <h1>Questionnaire</h1>

      <form class="login-form", method="post", action="/questionnaire">
        <div class="form-group"> 
          <label for="age">Age</label>
          <input 
            type="number" 
            id="age" 
            name="age"
            min="18"
            max="120"
            title="Please enter your age." 
            required>
        </div>

        <div class="form-group"> 
          <label for="height">Height (cm)</label>
          <input 
            type="number" 
            id="height" 
            name="height"
            min="120"
            max="220"
            title="Please enter your height." 
            required>
        </div>

        <div class="form-group"> 
          <label for="weight">Weight (kg)</label>
          <input 
            type="number" 
            id="weight" 
            name="weight"
            min="20"
            max="200"
            title="Please enter your weight." 
            required>
        </div>

        <div class="form-group"> 
          <label for="diet">What diet do you follow?</label>
          <select name ="diet" id="diet">
            <option value="omnivore">Omnivore</option>
            <option value="pesketarian">Pesketarian</option>
            <option value="Vegetarian">Vegan</option>
          </select>
        </div>

        <div class="form-group"> 
          <label for="religion">What religion do you identify with?</label>
          <select name ="religion" id="religion">
            <option value="christian">Christian</option>
            <option value="muslim">Muslim</option>
            <option value="jewish">Jewish</option>
            <option value="hindu">Hindu</option>
            <option value="Agnostic">Agnostic</option>
            <option value="no_religion">No Religion</option>
            <option value="no_response">Prefer not to say</option>
          </select>
        </div>

        <div class="form-group"> 
          <label for="allergens">Do you have any allergies? Select multiple if applicable.</label>
          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="milk">Milk</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="egg">Egg</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="peanut">Peanut</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="soy">Soy</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="wheat">Wheat</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="tree_nut">Tree Nut</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="shellfish">Shellfish</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="fish">Fish</label>
            <label class="checkbox-item"><input type="checkbox" name="allergens" value="sesame">Sesame</label>
          </div> 
        </div>

        <div class="form-group">
          <label for="cycle_length">Average Length of Menstrual Cycle (days)</label>
          <input 
            type="number" 
            id="cycle_length" 
            name="cycle_length"
            min="10"
            max="60"
            title="Please enter the average length of your menstrual cycle." 
            required>
        </div>

        <div class="form-group">
          <label for="menstrual_irregularity">Do you have irregular menstrual cycles?</label>
          <div class="radio-group">
            <label><input type="radio" id="yes" name="menstrual_irregularity" value="Yes"> Yes</label>
            <label><input type="radio" id="no" name="menstrual_irregularity" value="No" checked> No</label>
          </div>
        </div>
        
        <div class="form-group">
          <label for="pcos_diagnosis">Do you have PCOS?</label>
          <div class="radio-group">
            <label><input type="radio" id="yes" name="pcos_diagnosis" value="Yes"> Yes</label>
            <label><input type="radio" id="no" name="pcos_diagnosis" value="No" checked> No</label>
          </div>
        </div>

        <div class="form-group">
          <label for="sugar_intake">What is your average sugar intake level?</label>
          <input 
            type="number" 
            id="sugar_intake" 
            name="sugar_intake"
            min="1"
            max="3"
            title="Please enter your average sugar intake level." 
            required>
        </div>

        <div class="form-group">
          <label for="physical_activity">What is your physical activity level?</label>
          <input 
            type="number" 
            id="physical_activity" 
            name="physical_activity"
            min="1"
            max="3"
            title="Please enter your physical activity level." 
            required>
        </div>

        <div class="form-group">
          <label for="acne_severity">What acne severity level do you experience?</label>
          <input 
            type="number" 
            id="acne_severity" 
            name="acne_severity"
            min="0"
            max="3"
            title="Please enter your acne severity level." 
            required>
        </div>

        <div class="form-group">
          <label for="alopecia">Do you have alopecia?</label>
          <div class="radio-group">
            <label><input type="radio" id="yes" name="alopecia" value="Yes"> Yes</label>
            <label><input type="radio" id="no" name="alopecia" value="No" checked> No</label>
          </div>
        </div>

        <div class="form-group">
          <label for="acanthosis">Do you have skin darkening acanthosis?</label>
          <div class="radio-group">
            <label><input type="radio" id="yes" name="acanthosis" value="Yes"> Yes</label>
            <label><input type="radio" id="no" name="acanthosis" value="No" checked> No</label>
          </div>
        </div>
        
        <div class="form-group">
          <label for="hirsutism">Do you have hirsutism?</label>
          <div class="radio-group">
            <label><input type="radio" id="yes" name="hirsutism" value="Yes"> Yes</label>
            <label><input type="radio" id="no" name="hirsutism" value="No" checked> No</label>
          </div>
        </div>

        <div class="form-group">
          <label for="fg_score">What is your Ferriman-Gallwey Hirsutism score?</label>
          <input 
            type="number" 
            id="fg_score" 
            name="fg_score"
            min="0"
            max="24"
            title="Please enter your Ferriman-Gallwey Hirsutism score." 
            required>
        </div>

        <p>If you can also provide the following data it can support your recommendations.</p>
        <p>If you do not have this data, you can leave the fields blank.</p>
        
        <div class="form-group">
          <label for="lh_level">Last Recorded Luteneizing Hormone (LH) Level (mIU/mL)</label>
          <input 
            type="number" 
            id="lh_level" 
            name="lh_level"
            min="1"
            max="30">
        </div>

        <div class="form-group">
          <label for="fsh_level">Last Recorded Follicle-Stimulating Hormone (FSH) Level (mIU/mL)</label>
          <input 
            type="number" 
            id="fsh_level" 
            name="fsh_level"
            min="1"
            max="30">
        </div>

        <div class="form-group">
          <label for="glucose_level">Fasting Glucose Level (mg/dL)</label>
          <input 
            type="number" 
            id="glucose_level" 
            name="glucose_level"
            min="30"
            max="150">
        </div>

        <div class="form-group">
          <label for="insulin_level">Fasting Insulin Level (uIU/dL)</label>
          <input 
            type="number" 
            id="insulin_level" 
            name="insulin_level"
            min="1"
            max="40">
        </div>

        <div class="form-group">
          <label for="total_tes">Total Testosterone (ng/dL)</label>
          <input 
            type="number" 
            id="total_tes" 
            name="total_tes"
            min="1"
            max="120">
        </div>

        <div class="form-group">
          <label for="free_tes">Free Testosterone (pg/dL)</label>
          <input 
            type="number" 
            id="free_tes" 
            name="free_tes"
            min="1"
            max="20">
        </div>

        <div class="form-group">
          <label for="cholesterol">Total Cholesterol (mg/dL)</label>
          <input 
            type="number" 
            id="cholesterol" 
            name="cholesterol"
            min="90"
            max="350">
        </div>

        <div class="form-group">
          <label for="triglycerides">Total Triglycerides (mg/dL)</label>
          <input 
            type="number" 
            id="triglycerides" 
            name="triglycerides"
            min="90"
            max="350">
        </div>

        <button type="submit" class="btn btn-submit">Submit</button>
      </form>
    </div>
  </main>
    
  <!--JavaScript for menu sidebar-->
  <script>
    /*Opening the menu by changing the width to 250px */
    function openNav() {
      document.getElementById("sideMenu").style.width = "250px";
    }

    /*Closing the menu by changing the width back to 0 */
    function closeNav() {
      document.getElementById("sideMenu").style.width = "0";
    }
  </script> 
</body>
</html>
