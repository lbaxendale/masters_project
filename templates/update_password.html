<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">
    <title>nutrifem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/update_password.css') }}">
</head>

<body>
  <header class="navbar">
    <div class="menu-icon" onclick="openNav()">&#9776;</div>

    <div class="logo">
      <span class="flower-icon">&#10048;</span> nutrifem </div>

      <div class="user-profile">
        <span class="greeting">Hello, User</span>
        <span class="user-icon">&#128100;</span>
    </div>     
  </header>

  <!--To trigger the menu-->
  <div id="sideMenu" class="sidebar">
    <!-- Adding close button inside the menu-->
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <!--Links on the menu-->
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>


  <hr class="nav-divider">

  <!--Flash messages to show any errors in input validation -->
<div class="flash-message">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash">
          {% for category, message in messages %}
            <li class="flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

  <main class="login-wrapper">
    <div class="login-container">
      <h1>Update Password</h1>

      <form class="login-form", method="post", action="{{ url_for('update_password') }}">
        <div class="form-group"> 
          <label for="current_password">Enter Current Password</label>
          <input 
            type="password" 
            id="current_password" 
            name="current_password"
            title="Please enter your current password." 
            required>
        </div>

        <div class="form-group"> 
          <label for="new_password">Enter New Password</label>
          <input 
            type="password" 
            id="new_password" 
            name="new_password"
            maxlength="26"
            title="Please enter a new password." 
            required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$">
        </div>

        <div class="form-group">
          <label for="confirm_password">Re-enter New Password</label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password"
            title="Please re-enter the new password.">
        </div>

        <button type="submit" class="btn btn-submit">Update</button>
      </form>
    </div>
  </main>
    
  <!--JavaScript for menu sidebar-->
  <script>
    /*Opening the menu by changing the width to 250px */
    function openNav() {
      document.getElementById("sideMenu").style.width = "250px";
    }

    /*Closing the menu by changing the width back to 0 */
    function closeNav() {
      document.getElementById("sideMenu").style.width = "0";
    }
  </script> 
</body>
</html>
